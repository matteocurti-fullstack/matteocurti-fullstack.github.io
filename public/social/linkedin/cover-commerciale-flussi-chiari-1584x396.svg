<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title description">
  <title id="title">Il tuo team rincorre ancora lo stesso dato?</title>
  <desc id="description">Copertina LinkedIn commerciale di Matteo Curti sui flussi più chiari per team e PMI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164744"/>
      <stop offset="1" stop-color="#102d2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#061d1e" flood-opacity="0.3"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .eyebrow { fill: #e3a344; font-size: 13px; font-weight: 700; letter-spacing: 1.35px; }
      .small { fill: #c7d8d3; font-size: 14px; font-weight: 500; }
      .box-text { fill: #f7f6f2; font-size: 12px; font-weight: 700; letter-spacing: 0.65px; }
    </style>
  </defs>

  <rect width="1584" height="396" fill="url(#background)"/>
  <path d="M-20 64 C250 -22 420 84 621 -26" fill="none" stroke="#91c3b8" stroke-opacity="0.13" stroke-width="68"/>
  <rect x="1228" y="0" width="356" height="396" fill="#0b2225" fill-opacity="0.22"/>
  <rect x="1326" y="46" width="258" height="174" rx="34" fill="#315e58" fill-opacity="0.48"/>

  <g transform="translate(96 51)">
    <circle cx="47" cy="47" r="43" fill="#173e3d" stroke="#e3a344" stroke-width="5"/>
    <text x="47" y="61" text-anchor="middle" class="sans" fill="#f7f6f2" font-size="35" font-weight="700">MC</text>
  </g>

  <text x="226" y="77" class="sans eyebrow">PER TEAM E PMI</text>
  <text x="312" y="163" class="serif" fill="#f7f6f2" font-size="47" letter-spacing="-1.2">Il tuo team rincorre</text>
  <text x="312" y="216" class="serif" fill="#f7f6f2" font-size="47" letter-spacing="-1.2">ancora lo stesso <tspan fill="#e3a344" font-style="italic">dato?</tspan></text>
  <text x="314" y="264" class="sans small">Trasformo file, passaggi manuali e dati dispersi</text>
  <text x="314" y="287" class="sans small">in flussi più chiari.</text>
  <text x="314" y="351" class="sans" fill="#c7d8d3" font-size="12" letter-spacing="0.55">MATTEO CURTI — AI, AUTOMAZIONE E SOFTWARE SU MISURA</text>

  <g transform="translate(923 168)" filter="url(#shadow)">
    <text x="0" y="-22" class="sans" fill="#b9d0ca" font-size="11" font-weight="700" letter-spacing="0.9">DA DATI DISPERSI A UN FLUSSO CHE FUNZIONA</text>
    <rect x="0" y="0" width="102" height="48" rx="13" fill="#32635e"/>
    <rect x="116" y="0" width="102" height="48" rx="13" fill="#32635e"/>
    <rect x="232" y="0" width="102" height="48" rx="13" fill="#32635e"/>
    <text x="51" y="30" text-anchor="middle" class="sans box-text">EXCEL</text>
    <text x="167" y="30" text-anchor="middle" class="sans box-text">CHAT</text>
    <text x="283" y="30" text-anchor="middle" class="sans box-text">FILE</text>
    <path d="M22 76h287" stroke="#6fa59a" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M309 76h56m-14-14 14 14-14 14" fill="none" stroke="#e3a344" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="388" y="37" width="193" height="78" rx="16" fill="#0b1725" stroke="#557f78"/>
    <text x="484" y="69" text-anchor="middle" class="sans" fill="#e3eee9" font-size="12" font-weight="700" letter-spacing="0.6">UN FLUSSO CHIARO</text>
    <text x="484" y="92" text-anchor="middle" class="sans" fill="#b9ccc7" font-size="11">dati utili, lavoro più semplice</text>
  </g>
</svg>
