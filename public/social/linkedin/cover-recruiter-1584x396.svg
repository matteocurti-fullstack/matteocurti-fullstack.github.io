  </defs>

  <rect width="1584" height="396" fill="url(#background)"/>
  <path d="M44 0v396M93 0v396M142 0v396" stroke="#9ec9bf" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="1448" cy="79" r="140" fill="#2b5c57" fill-opacity="0.36"/>
  <circle cx="1530" cy="329" r="122" fill="#dca14b" fill-opacity="0.16"/>
  <path d="M1085 318 C1200 230 1310 341 1450 218 S1540 198 1592 245" fill="none" stroke="#7bb1a5" stroke-opacity="0.36" stroke-width="2"/>

