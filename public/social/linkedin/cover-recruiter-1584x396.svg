<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title description">
  <title id="title">Sviluppatore freelance: processi, dati e web app</title>
  <desc id="description">Copertina LinkedIn recruiter di Matteo Curti, con focus su processi, dati e web app.</desc>
  <defs>
