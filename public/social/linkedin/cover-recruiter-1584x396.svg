      <stop offset="0" stop-color="#133f3d"/>
      <stop offset="1" stop-color="#0a2729"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#061d1e" flood-opacity="0.32"/>
    </filter>
    <style>
