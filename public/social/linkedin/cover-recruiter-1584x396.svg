    <text x="175" y="31" text-anchor="middle" class="sans tag">PROCESSO</text>
    <text x="175" y="53" text-anchor="middle" class="sans" fill="#b9ccc7" font-size="11">persone · regole · dati</text>
    <rect x="0" y="124" width="174" height="76" rx="18" fill="#173e3d" stroke="#5f9288" stroke-opacity="0.75"/>
    <text x="87" y="155" text-anchor="middle" class="sans tag">SOFTWARE</text>
