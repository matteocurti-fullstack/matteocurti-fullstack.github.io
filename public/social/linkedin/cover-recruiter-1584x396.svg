  <text x="226" y="76" class="sans eyebrow">MATTEO CURTI / SVILUPPATORE FREELANCE</text>
  <text x="305" y="176" class="serif" fill="#f7f6f2" font-size="53" letter-spacing="-1.3">Processi · Dati · Web app</text>
  <text x="308" y="224" class="sans small">Progetto strumenti interni semplici da usare e facili da evolvere.</text>
  <text x="309" y="278" class="sans" fill="#9fc5bc" font-size="12" font-weight="700" letter-spacing="1.1">AI APPLICATA · AZURE · SISTEMI DISTRIBUITI</text>

